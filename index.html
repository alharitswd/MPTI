<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Toko Online Sederhana</title>
  <link rel="stylesheet" href="body.css" />
</head>
<body>
  <header>
    <h1>Toko Megi</h1>
    <p>Promo Hari Ini: Diskon 10% semua produk!</p>
  </header>

  <section id="keranjang">
    <h2> Keranjang Belanja </h2>
    <div id="listKeranjang"></div>
    <button class="button" onclick="kirimWhatsApp()">Kirim ke WhatsApp</button>
  </section>

  <section id="status-pembayaran">
    <h2>💳 Status Pembayaran</h2>
    <label for="status">Pilih status:</label>
    <select id="status" onchange="toggleUpload()">
      <option value="BELUM BAYAR">BELUM BAYAR</option>
      <option value="SUDAH BAYAR">SUDAH BAYAR</option>
    </select>
  
    <div id="upload-bukti" style="display: none; margin-top: 10px;">
      <label for="bukti">Upload Bukti Pembayaran:</label><br />
      <input type="file" id="bukti" accept="image/*" onchange="previewBukti()" />
      <div id="preview" style="margin-top: 10px;"></div>
    </div>
  </section>
  
  <section id="promo">
    <h2>🔥 Promo</h2>
    <div class="banner">Gratis Ongkir untuk Pembelian > Rp 100.000</div>
  </section>

  <section id="produk">
    <h2>🛍️ Produk</h2>
    <div class="produk-list" id="produkList"></div>
  </section>

  <section id="info-toko">
    <h2>🏪 Info Toko</h2>
    <p>Alamat: Jl. Contoh No. 1, Yogyakarta</p>
    <p>WA Admin: <a href="https://wa.me/6282398707777" target="_blank">+62 823-9870-7777</a></p>
    <iframe 
      src="https://https://www.google.com/maps/place/Istana+Sayur+dan+Buah+(ISB)/@-0.8626654,134.0481551,17z/data=!3m1!4b1!4m6!3m5!1s0x2d540b5d3f7765d9:0xf3a2a80e62b26c3!8m2!3d-0.8626654!4d134.05073!16s%2Fg%2F11v3m8qr_q?hl=en-US&entry=ttu&g_ep=EgoyMDI1MDQyNy4xIKXMDSoASAFQAw%3D%3D" 
      width="100%" height="200" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
  </section>

  <script src="const produkData.js"></script>
</body>
</html>
